<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="مفتاح ووثائق كراء">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="1080" cy="580" r="220" fill="#ffffff" opacity="0.06"/>

  <!-- the contract -->
  <g transform="translate(300 130)">
    <rect width="380" height="470" rx="16" fill="#f8fafc"/>
    <rect x="42" y="56" width="230" height="20" rx="10" fill="#1e293b" opacity="0.85"/>
    <g fill="#1e293b" opacity="0.28">
      <rect x="42" y="116" width="296" height="14" rx="7"/>
      <rect x="42" y="152" width="296" height="14" rx="7"/>
      <rect x="42" y="188" width="220" height="14" rx="7"/>
      <rect x="42" y="248" width="296" height="14" rx="7"/>
      <rect x="42" y="284" width="296" height="14" rx="7"/>
      <rect x="42" y="320" width="180" height="14" rx="7"/>
    </g>
    <!-- the stamp -->
    <circle cx="272" cy="392" r="52" fill="none" stroke="#059669" stroke-width="7" opacity="0.9"/>
    <path d="M248 392 l18 20 l34 -40" fill="none" stroke="#059669" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the key -->
  <g transform="translate(720 250) rotate(-20)" fill="#f8fafc">
    <circle cx="70" cy="70" r="62"/>
    <circle cx="70" cy="70" r="26" fill="#047857"/>
    <rect x="126" y="52" width="240" height="36" rx="10"/>
    <rect x="300" y="88" width="30" height="52" rx="8"/>
    <rect x="352" y="88" width="30" height="76" rx="8"/>
  </g>
</svg>
