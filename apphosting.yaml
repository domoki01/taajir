# ── FIREBASE APP HOSTING ─────────────────────────────────────────────────────
# Backend configuration for the taajir web app. App Hosting builds from the live
# branch on every push and serves the result on Cloud Run.
#
# Version note: App Hosting's pre-configured support currently designates
# Next.js 15.0–15.2 as "active"; this project runs Next 16.3, which App Hosting
# treats as "preview". That is a deliberate choice — the 15.2 line carries 26
# open high-severity advisories (SSRF, cache poisoning, XSS, DoS), all of which
# are fixed in the 16.3 stable release. Because of the preview status the build
# and run commands are stated explicitly below rather than left to framework
# auto-detection, so a change in App Hosting's detection logic cannot silently
# alter how this app is built.

runConfig:
  cpu: 1
  memoryMiB: 512
  # Scale to zero when idle. A classifieds site in its first months has long
  # quiet stretches, and an always-warm instance bills for all of them. The
  # trade-off is a cold start on the first request after idle; ISR-cached pages
  # absorb most of that.
  minInstances: 0
  # A ceiling, not a target. Left low on purpose: this is the only thing between
  # a traffic spike (or a crawler loop) and an unbounded Cloud Run bill.
  maxInstances: 2
  concurrency: 80

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  # Absolute origin. Feeds metadataBase, canonical URLs, OpenGraph tags and the
  # sitemap, so it must be correct at BUILD time as well as at runtime — a wrong
  # value here silently poisons every shareable link and every indexed page.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://taajir--newmokit.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME

# No service-account secret is declared, and that is deliberate. App Hosting
# runs this app on Cloud Run with a service account already attached, so
# firebase-admin authenticates through Application Default Credentials. Shipping
# a key as a secret would add a credential to rotate and a way to leak, for no
# capability the runtime does not already have. FIREBASE_SERVICE_ACCOUNT_JSON is
# only for a local machine, where ADC is absent.
