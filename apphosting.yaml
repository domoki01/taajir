# ── FIREBASE APP HOSTING ─────────────────────────────────────────────────────
# Backend configuration for the taajir web app. App Hosting builds from the live
# branch on every push and serves the result on Cloud Run.
#
# Version note: App Hosting's pre-configured support currently designates
# Next.js 15.0–15.2 as "active"; this project runs Next 16.3, which App Hosting
# treats as "preview". That is a deliberate choice — the 15.2 line carries 26
# open high-severity advisories (SSRF, cache poisoning, XSS, DoS), all of which
# are fixed in the 16.3 stable release. Because of the preview status the build
# and run commands are stated explicitly below rather than left to framework
# auto-detection, so a change in App Hosting's detection logic cannot silently
# alter how this app is built.

runConfig:
  cpu: 1
  memoryMiB: 512
  # Scale to zero when idle. A classifieds site in its first months has long
  # quiet stretches, and an always-warm instance bills for all of them. The
  # trade-off is a cold start on the first request after idle; ISR-cached pages
  # absorb most of that.
  minInstances: 0
  # A ceiling, not a target. Left low on purpose: this is the only thing between
  # a traffic spike (or a crawler loop) and an unbounded Cloud Run bill.
  maxInstances: 2
  concurrency: 80

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  # Absolute origin. Feeds metadataBase, canonical URLs, OpenGraph tags, the
  # sitemap, push-notification links and the referral invite link, so it must be
  # correct at BUILD time as well as at runtime — a wrong value here silently
  # poisons every shareable link and every indexed page.
  #
  # The custom domain, not the App Hosting one. Every link the site hands out is
  # built from this: an invite pasted into WhatsApp, the URL under a Facebook
  # share, the canonical tag Google indexes. A backend hostname in any of those
  # is the difference between a business and somebody's test deployment. The
  # generated hostname still serves the site and redirects here (next.config.ts).
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://taajirdz.com
    availability:
      - BUILD
      - RUNTIME

  # Whether a NEW account may be opened with a phone number.
  #
  # Off since Firebase's SMS backend began refusing this project's verification
  # codes: a valid reCAPTCHA token passes the captcha check and the send then
  # answers HTTP 503 `backendError` ("Error code: 39"), which the SDK reports as
  # an unmapped number. Measured, not guessed — the /diagnostic screen prints the
  # raw response. Thirty-five accounts were created by phone before it started,
  # the most recent hours earlier, so this is a change on Google's side.
  #
  # Signing *in* by phone is never hidden — those thirty-five accounts have no
  # email and no password, and their door has to keep working the moment
  # Google's does.
  #
  # To switch back: set this to "on" (or delete the variable) and deploy, then
  # watch somebody actually receive a code before trusting it.
  - variable: NEXT_PUBLIC_PHONE_SIGNUP
    value: "off"
    availability:
      - BUILD
      - RUNTIME

  # Google Search Console's proof that we own this domain.
  #
  # Until it verifies, Search Console shows nothing at all — no queries, no
  # impressions, no coverage errors, no way to submit the sitemap. For a
  # classifieds site whose entire acquisition story is people searching for
  # "شقة للكراء" plus a wilaya name, that is the one dashboard that matters.
  #
  # The alternative is a TXT record at the registrar. This tag is here because
  # the registrar is not always reachable by whoever is deploying, and a proof
  # that lives in the repository is re-asserted by every build instead of
  # depending on a DNS zone nobody has opened in a year.
  #
  # BUILD as well as RUNTIME: the tag is rendered into the document head, and
  # the home page is statically generated, so a value that only exists at
  # runtime would never reach the page Google actually fetches.
  #
  # Google mints a different token per property and per method. If Search
  # Console's "HTML tag" panel shows something other than this, that value wins
  # — replace it here and redeploy.
  - variable: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
    value: Bab1MWRNxemvglKtF8cJgfIL08PchaTa6270QiT-CwI
    availability:
      - BUILD
      - RUNTIME

  # The key that encrypts the few fields identifying a bank account: the RIP
  # number on a payout request and the Binance / BaridiMob handle on a prize
  # claim. It lives in Secret Manager, never in the repository and never in the
  # database it protects — a dump of `payouts` without this is a list of
  # amounts.
  #
  # Create it once, then grant the backend access:
  #
  #   firebase apphosting:secrets:set FIELD_ENCRYPTION_KEY
  #   firebase apphosting:secrets:grantaccess FIELD_ENCRYPTION_KEY --backend taajir
  #
  # The value must be 32 random bytes, base64:
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  #
  # RUNTIME only. The build has no business decrypting anything, and a secret
  # available at build time is a secret in the build logs.
  - variable: FIELD_ENCRYPTION_KEY
    secret: FIELD_ENCRYPTION_KEY
    availability:
      - RUNTIME

# No service-account secret is declared, and that is deliberate. App Hosting
# runs this app on Cloud Run with a service account already attached, so
# firebase-admin authenticates through Application Default Credentials. Shipping
# a key as a secret would add a credential to rotate and a way to leak, for no
# capability the runtime does not already have. FIREBASE_SERVICE_ACCOUNT_JSON is
# only for a local machine, where ADC is absent.
