<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="مبانٍ سكنية جزائرية">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="960" cy="150" r="70" fill="#f8fafc" opacity="0.14"/>
  <rect y="380" width="1200" height="295" fill="url(#glow)"/>

  <!-- a skyline of flats, the ordinary Algerian kind -->
  <g fill="#0f172a" opacity="0.55">
    <rect x="60" y="330" width="150" height="345" rx="4"/>
    <rect x="1000" y="300" width="150" height="375" rx="4"/>
  </g>
  <g fill="#f8fafc" opacity="0.9">
    <rect x="240" y="250" width="200" height="425" rx="6"/>
    <rect x="470" y="180" width="230" height="495" rx="6"/>
    <rect x="730" y="290" width="190" height="385" rx="6"/>
  </g>
  <!-- windows -->
  <g fill="#1e293b" opacity="0.85">
    <g>
      <rect x="266" y="286" width="42" height="52" rx="3"/><rect x="330" y="286" width="42" height="52" rx="3"/>
      <rect x="266" y="368" width="42" height="52" rx="3"/><rect x="330" y="368" width="42" height="52" rx="3"/>
      <rect x="266" y="450" width="42" height="52" rx="3"/><rect x="330" y="450" width="42" height="52" rx="3"/>
      <rect x="266" y="532" width="42" height="52" rx="3"/><rect x="330" y="532" width="42" height="52" rx="3"/>
    </g>
    <g>
      <rect x="500" y="220" width="46" height="56" rx="3"/><rect x="570" y="220" width="46" height="56" rx="3"/><rect x="640" y="220" width="30" height="56" rx="3"/>
      <rect x="500" y="308" width="46" height="56" rx="3"/><rect x="570" y="308" width="46" height="56" rx="3"/><rect x="640" y="308" width="30" height="56" rx="3"/>
      <rect x="500" y="396" width="46" height="56" rx="3"/><rect x="570" y="396" width="46" height="56" rx="3"/><rect x="640" y="396" width="30" height="56" rx="3"/>
      <rect x="500" y="484" width="46" height="56" rx="3"/><rect x="570" y="484" width="46" height="56" rx="3"/><rect x="640" y="484" width="30" height="56" rx="3"/>
    </g>
    <g>
      <rect x="756" y="326" width="40" height="50" rx="3"/><rect x="818" y="326" width="40" height="50" rx="3"/>
      <rect x="756" y="404" width="40" height="50" rx="3"/><rect x="818" y="404" width="40" height="50" rx="3"/>
      <rect x="756" y="482" width="40" height="50" rx="3"/><rect x="818" y="482" width="40" height="50" rx="3"/>
    </g>
  </g>
  <!-- one lit window: the flat that just found a tenant -->
  <rect x="570" y="396" width="46" height="56" rx="3" fill="#059669"/>
  <rect y="640" width="1200" height="35" fill="#0f172a"/>
</svg>
